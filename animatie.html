<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Space Motion Animator</title>

    <link rel="stylesheet" href="animatie.css">

    <!-- MediaPipe -->
    <script type="module" src="animatie.js"></script>
</head>

<body>

<header class="top-window">
    <input
        type="text"
        value="·.✦ ݁˖ Space Motion Animator ✦ ݁˖·"
        readonly
    >
</header>


<main class="page">

    <h1>✦ Space Motion Animator ✦</h1>

    <p id="instruction">
        Klik op "Camera starten" om te beginnen.
    </p>


    <div class="camera-box">

     <video
         id="camera"
         autoplay
         playsinline
         muted>
     </video>

    <canvas id="overlay"></canvas>

    </div>


    <div class="status-box">

        <h2 id="poseTitle">Pose 1</h2>

        <p id="status">
            Zet je handen klaar.
        </p>

        <div class="progress">
            <span id="progressText">0 / 3</span>
        </div>

    </div>


    <div class="buttons">

        <button id="startCamera">
            📷 Camera starten
        </button>

        <button id="restart" disabled>
            ↻ Opnieuw
        </button>

    </div>


    <section id="animationSection" class="animation-section hidden">

        <h2>✦ Jouw animatie ✦</h2>

        <div class="animation-box">

            <canvas id="animationCanvas"></canvas>

            <div id="hearts"></div>

        </div>

        <button id="playAnimation">
            ▶ Animatie afspelen
        </button>

    </section>


    <a href="index.html" class="home-button">
        ★ Terug naar Home
    </a>

</main>


<audio id="music" src="muziek.mp3"></audio>

</body>
</html>

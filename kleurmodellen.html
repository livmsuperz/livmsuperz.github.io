                            Hoe werkt het?
                        </h2>

                        <p>
                            Verschillende kleurmodellen

Kleuren zijn overal om ons heen en spelen een belangrijke rol in kunst, ontwerp en technologie. Om kleuren goed te kunnen maken en gebruiken, zijn er verschillende kleurmodellen.

RGB staat voor rood, groen en blauw. Dit model wordt vooral gebruikt voor beeldschermen. Door deze drie kleuren in verschillende hoeveelheden te mengen, ontstaan andere kleuren.

CMYK staat voor cyaan, magenta, geel en zwart. Dit kleurmodel wordt vooral gebruikt bij printers. De kleuren worden met elkaar gecombineerd om de juiste kleur op papier te maken.

RYB staat voor rood, geel en blauw. Dit model wordt vaak gebruikt bij schilderen en tekenen. Door deze kleuren te mengen kun je nieuwe kleuren maken, zoals oranje, groen en paars.

Elk kleurmodel heeft dus een ander doel, maar ze worden allemaal gebruikt om kleuren te maken en te beschrijven.
                        </p>

```
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background-color: #111111;
        font-family: Arial, sans-serif;
        height: 100vh;
        overflow: hidden;
    }

    /* Titel in het midden */
    .welcome {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);

        color: white;
        font-size: 55px;
        font-weight: bold;
        text-align: center;
        white-space: nowrap;
    }

    /* Typvak rechtsboven */
    .search-box {
        position: absolute;
        top: 25px;
        right: 30px;
    }

    .search-box input {
        width: 250px;
        height: 42px;
        padding: 10px 15px;

        border: 2px solid white;
        border-radius: 8px;
        background-color: #222222;
        color: white;

        font-size: 16px;
        outline: none;
    }

    .search-box input::placeholder {
        color: #aaaaaa;
    }

    /* Menu links */
    .menu {
        position: absolute;
        top: 25px;
        left: 25px;

        width: 220px;
        height: 500px;

        background-color: #222222;
        border: 2px solid white;
        border-radius: 10px;

        padding: 20px;
    }

    .menu h2 {
        color: white;
        text-align: center;
        margin-bottom: 20px;
    }

    .menu a {
        display: block;
        color: white;
        text-decoration: none;

        padding: 12px;
        margin-bottom: 10px;

        background-color: #333333;
        border-radius: 6px;
        text-align: center;
    }

    .menu a:hover {
        background-color: #555555;
    }
</style>
```

</head>

<body>

```
<!-- Menu links -->
<div class="menu">
    <h2>MENU</h2>

    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Projects</a>
    <a href="#">Contact</a>
</div>

<!-- Typvak rechtsboven -->
<div class="search-box">
    <input type="text" placeholder="Type here...">
</div>

<!-- Welkomsttekst -->
<div class="welcome">
    WELCOME TO MY WEBSITE
</div>
```

</body>
</html>
